<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chore songbook</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--bg:#12132d;--panel:#25254e;--line:#ffffff20;--ink:#f7f4ff;--muted:#c7c3e3;--lav:#bdb4ff;--pink:#ff9cc6;--gold:#ffc76b;--mint:#8fe0cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#7869bd77,transparent 27rem),radial-gradient(circle at 94% 15%,#ffb66b25,transparent 25rem),var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.hero{margin:20px 0 18px;min-height:290px;position:relative;overflow:hidden;padding:38px clamp(24px,6vw,66px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(125deg,#675aaacc,#24234fdd 56%,#713e70b5);box-shadow:0 20px 60px #04051655}.hero:before{content:"☾";position:absolute;right:-16px;top:-92px;color:#fff3cf;font:260px serif;opacity:.18}.stars{letter-spacing:13px;color:#ffe2a3;font-size:1.05rem}.eyebrow{font:600 .75rem "DM Sans";letter-spacing:.18em;color:#ffdd9e;margin:19px 0 4px}.hero h1{font:700 clamp(3.5rem,11vw,6.5rem)/1 "DM Sans";letter-spacing:-.08em;margin:0}.hero h1 span{color:var(--gold)}.hero p{color:#f1edff;margin:17px 0 0;font-size:1rem}section{border:1px solid var(--line);border-radius:26px;background:#ffffff0d;padding:clamp(18px,4vw,32px);margin:16px 0;box-shadow:0 12px 38px #05051d24}.top{display:flex;justify-content:space-between;gap:15px;align-items:end}.top h2{margin:0;font-size:clamp(1.4rem,4vw,2.1rem)}.top small{color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:#ffffff0d;border-radius:999px;padding:9px 13px}.primary{background:linear-gradient(135deg,var(--lav),var(--pink));border:0;color:#231b3d;font-weight:700}.tools{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin:20px 0 12px}.search{width:100%;border:1px solid var(--line);background:#0b0b2638;color:white;border-radius:15px;padding:13px 15px;outline:none}.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.chip.active{background:var(--lav);color:#211b3a;border-color:var(--lav);font-weight:700}.filters{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}.filters select{background:#ffffff12;border:1px solid var(--line);color:white;padding:8px;border-radius:10px}.filters option{color:#1f1b36}.rows{display:grid;gap:8px}.song{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:13px 14px;border:1px solid #ffffff12;border-radius:17px;background:#ffffff08}.song:hover{background:#ffffff12}.song h3{font-size:1rem;margin:0 0 3px}.song p{font-size:.82rem;color:var(--muted);margin:0}.tag{display:inline-block;border-radius:99px;padding:2px 7px;background:#ffffff16;font-size:.68rem;margin-left:6px;color:#dcd8ff}.actions{display:flex;gap:5px}.icon{padding:7px 8px;font-size:.9rem}.on.fav{background:#ff9dc866;color:#fff}.on.practice{background:#8fe0cc55;color:#fff}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{border:1px solid #ffffff30;border-radius:23px;background:#292854;color:var(--ink);width:min(440px,90vw);box-shadow:0 18px 70px #0008}dialog::backdrop{background:#06061aaa}dialog form{display:grid;gap:12px}dialog input,dialog select{background:#15152f;color:white;border:1px solid var(--line);border-radius:12px;padding:11px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:end;gap:8px}.help{font-size:.75rem;color:var(--muted);margin:16px 0 0;text-align:center}footer{text-align:center;color:#aaa6ce;font:600 .72rem "DM Sans";letter-spacing:.08em;padding:28px 0 45px}@media(max-width:580px){.hero{min-height:260px;padding:33px 25px}.tools{grid-template-columns:1fr auto}.tools button:first-of-type{grid-column:span 2}.top{align-items:start;flex-direction:column}.filters{align-items:start;flex-direction:column}.song{padding:12px}.actions{gap:3px}.icon{padding:7px}.hero h1{font-size:4.5rem}}
</style></head><body><main class="wrap"><header class="hero"><div class="stars">✦ ✧ ✦</div><div class="eyebrow">CHORE'S MOONLIGHT SONGBOOK</div><h1>my <span>song</span></h1><p>歌いたい曲を、月明かりの曲帳に。<br>見つけたら、そっと印をつけてね。</p></header><section><div class="top"><div><h2>☾ 曲リスト <span id="count">0</span></h2><small>☆ お気に入り　♬ 練習中　✎ 曲を編集</small></div><button class="primary" id="add">＋ 曲を追加</button></div><div class="tools"><input class="search" id="q" placeholder="曲名・アーティストを検索"><button id="draw">🎲 今日の運曲</button><button id="copy">📋 コピー</button></div><div class="chips" id="genres"></div><div class="filters"><div class="chips" id="modes"><button class="chip active" data-mode="all">すべて</button><button class="chip" data-mode="fav">☆ お気に入り</button><button class="chip" data-mode="practice">♬ 練習中</button></div><select id="sort"><option value="artist">アーティスト順</option><option value="title">曲名順</option></select></div><div id="rows" class="rows"><div class="empty">曲リストを読み込み中…</div></div><p class="help">追加・編集・マークは、この端末のブラウザに保存されます。</p></section><footer>🍊 CHORE 💍 · MOONLIGHT SONGBOOK</footer></main><dialog id="editor"><form id="form"><div class="modal-head"><h3 id="formtitle">曲を追加</h3><button type="button" id="close">×</button></div><input id="title" required placeholder="曲名"><input id="artist" required placeholder="アーティスト"><select id="genre"><option>J-POP</option><option>アニメ</option><option>ジブリ</option><option>アイドル</option><option>ディズニー</option><option>ボカロ</option></select><div class="modal-actions"><button type="button" id="remove">削除</button><button class="primary">保存する</button></div></form></dialog><script>
const source='https://raw.githubusercontent.com/chore-37/my-song-list/main/index.html';let base=[],genre='すべて',mode='all',editKey=null;const $=s=>document.querySelector(s),store=k=>JSON.parse(localStorage.getItem(k)||'{}'),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let marks=store('choreMarks'),edits=store('choreEdits'),custom=store('choreCustom');const key=s=>s.title+'｜'+s.artist,clean=s=>s.replace(/^[🎸🎙️🔺🎤\s]+/,'');
async function load(){try{let t=await fetch(source).then(r=>r.text()),m=t.match(/const songs = \[([\s\S]*?)\n\];/);base=Function('return ['+m[1]+']')()}catch(e){$('#rows').innerHTML='<div class="empty">曲リストを読み込めませんでした。再読み込みしてみてね。</div>'}render()}
function songs(){return [...base,...Object.values(custom)].map(s=>({...s,...(edits[key(s)]||{})}))}function list(){let q=clean($('#q').value.toLowerCase()),a=songs().filter(s=>(genre==='すべて'||s.genre===genre)&&(mode==='all'||marks[key(s)]?.[mode])&&(clean(s.title).toLowerCase().includes(q)||s.artist.toLowerCase().includes(q)));let prop=$('#sort').value;a.sort((x,y)=>clean(x[prop]).localeCompare(clean(y[prop]),'ja'));return a}
function render(){let all=songs(), gs=['すべて',...new Set(all.map(s=>s.genre))];$('#genres').innerHTML=gs.map(g=>`<button class="chip ${g===genre?'active':''}" data-genre="${g}">${g}</button>`).join('');let a=list();$('#count').textContent=a.length+'曲';$('#rows').innerHTML=a.length?a.map(s=>{let k=key(s),m=marks[k]||{};return `<article class="song"><div><h3>${s.title}<span class="tag">${s.genre}</span></h3><p>${s.artist}</p></div><div class="actions"><button class="icon ${m.fav?'on fav':''}" data-mark="fav" data-key="${k}" title="お気に入り">☆</button><button class="icon ${m.practice?'on practice':''}" data-mark="practice" data-key="${k}" title="練習中">♬</button><button class="icon" data-edit="${k}" title="編集">✎</button></div></article>`}).join(''):'<div class="empty">見つからなかったよ ☾</div>';$('#genres').querySelectorAll('button').forEach(b=>b.onclick=()=>{genre=b.dataset.genre;render()});$('#rows').querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{let x=marks[b.dataset.key]||{};x[b.dataset.mark]=!x[b.dataset.mark];marks[b.dataset.key]=x;save('choreMarks',marks);render()});$('#rows').querySelectorAll('[data-edit]').forEach(b=>openEdit(b.dataset.edit))}
function openEdit(k){let s=songs().find(x=>key(x)===k);editKey=k;$('#formtitle').textContent='曲を編集';$('#title').value=clean(s.title);$('#artist').value=s.artist;$('#genre').value=s.genre;$('#remove').style.display=custom[k]?'block':'none';$('#editor').showModal()}function openAdd(){editKey=null;$('#form').reset();$('#formtitle').textContent='曲を追加';$('#remove').style.display='none';$('#editor').showModal()}
$('#add').onclick=openAdd;$('#close').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();let s={title:$('#title').value.trim(),artist:$('#artist').value.trim(),genre:$('#genre').value};if(editKey){if(custom[editKey]){delete custom[editKey];custom[key(s)]=s;save('choreCustom',custom)}else{edits[editKey]=s;save('choreEdits',edits)}}else{custom[key(s)]=s;save('choreCustom',custom)}$('#editor').close();render()};$('#remove').onclick=()=>{if(editKey&&custom[editKey]){delete custom[editKey];save('choreCustom',custom);$('#editor').close();render()}};$('#q').oninput=render;$('#sort').onchange=render;$('#modes').onclick=e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;$('#modes').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));render()}};$('#draw').onclick=()=>{let a=list();if(a.length){let s=a[Math.floor(Math.random()*a.length)];alert('☾ 今日の運曲 ☾\n\n'+s.title+' / '+s.artist)}};$('#copy').onclick=()=>navigator.clipboard.writeText(list().map(s=>s.title+' / '+s.artist).join('\n')).then(()=>alert('表示中の曲をコピーしました！'));load();
</script></body></html>
