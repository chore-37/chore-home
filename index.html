<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ちょれ🍊💍｜Moonlight Songbook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    :root{--bg:#12132d;--panel:#25254e;--line:#ffffff20;--ink:#f7f4ff;--muted:#c7c3e3;--lav:#bdb4ff;--pink:#ff9cc6;--gold:#ffc76b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#7869bd77,transparent 27rem),radial-gradient(circle at 94% 15%,#ffb66b25,transparent 25rem),var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.hero{margin:20px 0 18px;min-height:310px;position:relative;overflow:hidden;padding:38px clamp(24px,6vw,66px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(125deg,#675aaacc,#24234fdd 56%,#713e70b5);box-shadow:0 20px 60px #04051655}.hero:before{content:"☾";position:absolute;right:-16px;top:-92px;color:#fff3cf;font:260px serif;opacity:.18}.stars{letter-spacing:13px;color:#ffe2a3;font-size:1.05rem}.eyebrow{font:600 .75rem "DM Sans";letter-spacing:.18em;color:#ffdd9e;margin:19px 0 4px}.hero h1{font:700 clamp(3.1rem,10vw,6.1rem)/1 "DM Sans";letter-spacing:-.08em;margin:0}.hero h1 span{color:var(--gold)}.name{margin:16px 0 0;font-weight:700;font-size:clamp(1.22rem,3vw,1.65rem);letter-spacing:.06em;color:#fff4da}.hero p{color:#f1edff;margin:9px 0 0;font-size:1rem}section{border:1px solid var(--line);border-radius:26px;background:#ffffff0d;padding:clamp(18px,4vw,32px);margin:16px 0;box-shadow:0 12px 38px #05051d24}.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.intro h2,.top h2{margin:0;font-size:clamp(1.35rem,4vw,2.1rem)}.intro p{color:var(--muted);line-height:1.9;margin:11px 0 0}.legend{display:grid;gap:8px;align-content:center}.legend div{border:1px solid var(--line);padding:10px 12px;border-radius:14px;background:#ffffff09}.legend b{color:#ffe4aa}.top{display:flex;justify-content:space-between;gap:15px;align-items:end}.top small{color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:#ffffff0d;border-radius:999px;padding:9px 13px}.tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin:20px 0 12px}.search{width:100%;border:1px solid var(--line);background:#0b0b2638;color:white;border-radius:15px;padding:13px 15px;outline:none}.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.chip.active{background:var(--lav);color:#211b3a;border-color:var(--lav);font-weight:700}.filters{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}.filters select{background:#ffffff12;border:1px solid var(--line);color:white;padding:8px 30px 8px 10px;border-radius:10px}.filters option{color:#1f1b36}.rows{display:grid;gap:8px}.song{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:13px 14px;border:1px solid #ffffff12;border-radius:17px;background:#ffffff08}.song:hover{background:#ffffff12}.song h3{font-size:1rem;margin:0 0 3px}.song p{font-size:.82rem;color:var(--muted);margin:0}.tag{display:inline-block;border-radius:99px;padding:2px 7px;background:#ffffff16;font-size:.68rem;margin-left:6px;color:#dcd8ff}.copy-one{font-size:.82rem;padding:8px 11px}.empty{padding:32px;text-align:center;color:var(--muted)}.help{font-size:.75rem;color:var(--muted);margin:16px 0 0;text-align:center}footer{text-align:center;color:#aaa6ce;font:600 .72rem "DM Sans";letter-spacing:.08em;padding:28px 0 45px}@media(max-width:580px){.hero{min-height:280px;padding:33px 25px}.tools{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.filters{align-items:start;flex-direction:column}.song{padding:12px}.intro{grid-template-columns:1fr}.hero h1{font-size:4.1rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div class="stars">✦ ✧ ✦</div><div class="eyebrow">CHORE'S MOONLIGHT SONGBOOK</div><h1>my <span>song</span></h1><div class="name">ちょれ🍊💍</div><p>歌いたい曲を、月明かりの曲帳に。</p></header>
    <section class="intro"><div><h2>☾ 曲リストについて</h2><p>ちょれ🍊💍が配信で歌える曲のリストです。<br>リクエストしたい曲を見つけたら、曲名の右にある「コピー」からすぐに送れます。</p></div><div class="legend" aria-label="記号の説明"><div><b>🎸</b> 弾き語りできる曲</div><div><b>🎙</b> カラオケのみの曲</div><div><b>🎸 🎤</b> オケ付き弾き語りできる曲</div><div><b>🔺</b> 練習中の曲</div></div></section>
    <section><div class="top"><div><h2>☾ 曲リスト <span id="count">0</span></h2><small>気になる曲を見つけたら、コピーしてリクエストしてね。</small></div></div><div class="tools"><input class="search" id="q" placeholder="曲名・アーティストを検索"><button id="draw">🎲 今日の運曲</button></div><div class="chips" id="genres"></div><div class="filters"><span>並び替え</span><select id="sort"><option value="artist">アーティスト順</option><option value="title">曲名順</option></select></div><div id="rows" class="rows"><div class="empty">曲リストを読み込み中…</div></div><p class="help">※ 曲の追加・編集は、ちょれが管理しています。</p></section>
    <footer>ちょれ🍊💍 · MOONLIGHT SONGBOOK</footer>
  </main>
  <script src="song-data.js"></script>
  <script>
    let genre='すべて'; const $=s=>document.querySelector(s); const icon=s=>`${s.practice?'🔺 ':''}${s.type==='guitar'?'🎸':s.type==='backing'?'🎸 🎤':'🎙'}`; const norm=s=>s.toLowerCase();
    function list(){const q=norm($('#q').value.trim()),prop=$('#sort').value;return songs.filter(s=>(genre==='すべて'||s.genre===genre)&&(norm(s.title).includes(q)||norm(s.artist).includes(q))).sort((a,b)=>a[prop].localeCompare(b[prop],'ja'))}
    function render(){const genres=['すべて',...new Set(songs.map(s=>s.genre))];$('#genres').innerHTML=genres.map(g=>`<button class="chip ${g===genre?'active':''}" data-genre="${g}">${g}</button>`).join('');$('#genres').querySelectorAll('button').forEach(b=>b.onclick=()=>{genre=b.dataset.genre;render()});const a=list();$('#count').textContent=`${a.length}曲`;$('#rows').innerHTML=a.length?a.map((s,i)=>`<article class="song"><div><h3>${s.title}<span class="tag">${s.genre}</span></h3><p>${icon(s)}　${s.artist}</p></div><button class="copy-one" data-index="${i}">コピー</button></article>`).join(''):'<div class="empty">見つからなかったよ ☾</div>';$('#rows').querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>copy(a[Number(b.dataset.index)],b))}
    function copy(s,button){navigator.clipboard.writeText(s.title).then(()=>{button.textContent='コピーした！';setTimeout(()=>button.textContent='コピー',1200)})}
    $('#q').oninput=render;$('#sort').onchange=render;$('#draw').onclick=()=>{const a=list();if(a.length){const s=a[Math.floor(Math.random()*a.length)];alert(`☾ 今日の運曲 ☾\n\n${icon(s)} ${s.title}\n${s.artist}`)}};render();
  </script>
</body>
</html>
